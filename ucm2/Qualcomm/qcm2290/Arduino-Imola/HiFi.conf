# Use case configuration for Arduino UNO Q (Imola)

SectionVerb {
	Value {
		TQ "HiFi"
	}
	EnableSequence [
		cset "name='RX_CODEC_DMA_RX_0 Audio Mixer MultiMedia1' 1"
		cset "name='MultiMedia3 Mixer TX_CODEC_DMA_TX_3' 1"
		cset "name='SEC_MI2S_RX Audio Mixer MultiMedia4' 1"
		# Shared by all the analog outputs, which only differ by the DAC
		cset "name='HPHL Switch' 1"
		cset "name='HPHR Switch' 1"
	]

	Include.rxme.File "/codecs/qcom-lpass/rx-macro/HeadphoneEnableSeq.conf"
}

SectionDevice."Headphones" {
	Comment "Headphones playback"

	# PipeWire enables the new output before disabling the old one, and EAR and LO
	# share one amplifier: switch the other DACs off first
	EnableSequence [
		cset "name='LO_RDAC Switch' 0"
		cset "name='EAR_RDAC Switch' 0"
		cset "name='HPHL_RDAC Switch' 1"
		cset "name='HPHR_RDAC Switch' 1"
	]

	DisableSequence [
		cset "name='HPHL_RDAC Switch' 0"
		cset "name='HPHR_RDAC Switch' 0"
	]

	Value {
		PlaybackPriority 200
		PlaybackPCM "hw:${CardId},0"
		PlaybackMixer "default:${CardId}"
		PlaybackMixerElem "RX Digital"
	}
}

SectionDevice."Line1" {
	Comment "Analog Line Output"

	EnableSequence [
		cset "name='HPHL_RDAC Switch' 0"
		cset "name='HPHR_RDAC Switch' 0"
		cset "name='EAR_RDAC Switch' 0"
		cset "name='LO_RDAC Switch' 1"
	]

	DisableSequence [
		cset "name='LO_RDAC Switch' 0"
	]

	Value {
		PlaybackPriority 100
		PlaybackPCM "hw:${CardId},0"
		PlaybackMixer "default:${CardId}"
		PlaybackMixerElem "RX Digital"
	}
}

SectionDevice."Earpiece" {
	Comment "Earpiece playback"

	EnableSequence [
		cset "name='HPHL_RDAC Switch' 0"
		cset "name='HPHR_RDAC Switch' 0"
		cset "name='LO_RDAC Switch' 0"
		cset "name='EAR_RDAC Switch' 1"
	]

	DisableSequence [
		cset "name='EAR_RDAC Switch' 0"
	]

	Value {
		PlaybackPriority 100
		PlaybackPCM "hw:${CardId},0"
		PlaybackMixer "default:${CardId}"
		PlaybackMixerElem "RX Digital"
	}
}

If.dp {
	Condition {
		Type ControlExists
		# ANX7625 hdmi-codec on the DP backend, gone when a DSI panel overlay disables the link
		Control "iface=PCM,name='ELD',device=5"
	}
	True.SectionDevice."HDMI1" {
		Comment "DisplayPort playback"

		Value {
			PlaybackPriority 100
			PlaybackChannels 2
			PlaybackPCM "hw:${CardId},3"
		}
	}
}

SectionDevice."Headset" {
	Comment "Headset microphone"

	Include.pmmice.File "/codecs/pm4125/HeadphoneMicEnableSeq.conf"
	Include.pmmicd.File "/codecs/pm4125/HeadphoneMicDisableSeq.conf"
	Include.txmmice.File "/codecs/qcom-lpass/tx-macro/SoundwireMic1EnableSeq.conf"
	Include.txmmicd.File "/codecs/qcom-lpass/tx-macro/SoundwireMicDisableSeq.conf"

	Value {
		CapturePriority 100
		CapturePCM "hw:${CardId},2"
		CaptureChannels 1
		CaptureMixer "default:${CardId}"
		CaptureMixerElem "TX_DEC0"
	}
}
